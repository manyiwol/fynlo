<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Not found — Redirecting</title>
    <meta http-equiv="refresh" content="0; url=./#/" />
    <script>
      (function () {
        try {
          // Build a hash URL from the original path so the SPA can handle it.
          // For GitHub Pages project sites, strip the repository base path
          // before applying hash routing.
          var path = location.pathname + location.search;
          var normalized = path.replace(/^\/[^\/]+/, "") || "/";
          location.replace("./#" + normalized + location.hash);
        } catch (e) {
          // Fallback to root hash
          location.replace("./#/");
        }
      })();
    </script>
  </head>
  <body>
    <p>Page not found — redirecting to the app...</p>
  </body>
</html>
